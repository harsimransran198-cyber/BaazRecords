# Builds the site and publishes it to GitHub Pages.
# Runs on every push to main, once a day (so past shows drop off), or by hand.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: '30 0 * * *' # 06:00 India time
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      urls: ${{ steps.urls.outputs.list }}
    steps:
      - name: Check out the code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Build with Astro
        uses: withastro/action@a8b97df764791eb61fbf3338ef713b0e61ae05c5 # v6.1.4
        with:
          node-version: 22
      # The live site refuses requests from GitHub's servers, so take the page list from the build.
      - name: List page addresses for IndexNow
        id: urls
        run: echo "list=$(grep -o '<loc>[^<]*' dist/sitemap-0.xml | sed 's/<loc>//' | head -1000 | jq -R . | jq -sc .)" >> "$GITHUB_OUTPUT"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  # Tells Bing, Yandex, Seznam and Naver (IndexNow) which pages exist, right after each
  # push. Bing's index also feeds ChatGPT search and Copilot. Skipped on the daily rebuild.
  indexnow:
    needs: [build, deploy]
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Ping IndexNow
        env:
          # Public by design: IndexNow requires this same key to be published at /<key>.txt
          KEY: c01a55658bb35de817bc65200f86684d # gitleaks:allow
          HOST: baazrecords.in
          URLS: ${{ needs.build.outputs.urls }}
        run: |
          sleep 20 # give GitHub Pages a moment to serve the new version
          urls="${URLS:-[]}"
          body=$(jq -nc --arg host "$HOST" --arg key "$KEY" --argjson urls "$urls" \
            '{host: $host, key: $key, keyLocation: ("https://" + $host + "/" + $key + ".txt"), urlList: $urls}')
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST https://api.indexnow.org/indexnow \
            -H 'Content-Type: application/json; charset=utf-8' -d "$body")
          echo "IndexNow answered $code for $(echo "$urls" | jq length) URLs"
